{%- import "ui.html" as ui -%}
<main id="consult" class="cs-app" data-conv-id="{{ conv_id }}">
  <section class="cs-left">
    <div class="{{ ui.card }} cs-face">
      <div class="{{ ui.card_head }}"><h2 class="{{ ui.card_title }}" data-slot="face-title"></h2></div>
      <div class="cs-face__canvas">
        {%- include "_face.svg" %}
        {%- include "partials/sites.html" %}
      </div>
    </div>
    <div class="{{ ui.card }} cs-list-card">
      <div class="{{ ui.card_head }}"><h2 class="{{ ui.card_title }}" data-slot="list-title"></h2></div>
      {%- include "partials/list.html" %}
    </div>
  </section>
  <section class="{{ ui.card }} cs-chat">
    <div class="{{ ui.card_head }} cs-chat__head"><h2 class="{{ ui.card_title }}" data-slot="chat-title"></h2></div>
    <div id="chat-log" class="cs-log" data-cs-scroll>
      {%- for t in turns %}
      {%- include "partials/turn.html" %}
      {%- endfor %}
    </div>
    <form class="cs-form" hx-post="/c/{{ conv_id }}/turns" hx-target="#chat-log" hx-swap="beforeend" data-cs-form>
      <div class="cs-form__box">
        <textarea class="cs-form__input" name="text" rows="1" autocomplete="off" placeholder="" data-slot="input-placeholder" data-cs-input autofocus></textarea>
        <button type="submit" class="{{ ui.btn('primary', 's', 'cs-form__send') }}" data-cs-send>
          <span class="cs-sr" data-slot="send-label"></span>
          <svg class="cs-form__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </section>
</main>
