{#- 머리 꼴 = DAY base.html(htmx 설정 meta · defer 스크립트 순서 · #ms-progress). DAY 셸 · CSRF 는 가져오지 않는다 -#}
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
  <title data-slot="page-title"></title>
  <link rel="stylesheet" href="/static/medikit.css">
  <link rel="stylesheet" href="/static/consult.css">
  <script defer src="/static/htmx.min.js?v=2.0.4"></script>
  <script defer src="/static/htmx-ext-sse.js?v=2.2.4"></script>
  <script defer src="/static/medikit.js"></script>
  <script defer src="/static/consult.js"></script>
</head>
<body>
  <div id="ms-progress" class="ms-progress" aria-hidden="true"></div>
  {%- block body %}{% endblock %}
</body>
</html>
