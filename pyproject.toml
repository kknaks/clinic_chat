[project]
name = "clinic-chat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic[mcp]==2.3.0",
    "mcp==2.3.0",
    "typesafe-sdk==0.7.5",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sse-starlette==3.6.0",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.uv]
package = false
